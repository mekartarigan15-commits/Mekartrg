<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Kelengkapan Dokumen - Sensus Ekonomi 2026</title>
    <style>
        :root {
            --se-orange: #F5A623;
            --se-dark: #1A202C; 
            --text-black: #1A202C; 
            --text-gray: #4A5568;  
            --border-line: #E2E8F0; 
            --bg-light: #F8FAFC;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F3F4F6;
            color: var(--text-black);
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
        }

        .header-se {
            background-color: #1A202C;
            background-image: radial-gradient(#2D3748 15%, transparent 15%);
            background-size: 16px 16px;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 6px solid #E53E3E; 
            box-shadow: var(--shadow-md);
        }

        .header-title-top {
            color: #FFFFFF;
            font-size: 38px; 
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        .header-title-bottom {
            color: var(--se-orange);
            font-size: 30px; 
            font-weight: 800;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
        }
        .main-content {
            max-width: 85%;
            margin: 50px auto;
            padding: 60px 40px;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 40px 20px;
            justify-content: center;
        }

        .col-4-row {
            grid-column: span 3;
        }

     
        .col-3-row {
            grid-column: span 4;
        }


        .doc-card {
            text-align: center;
            padding: 10px;
        }

  
        .doc-link {
            text-decoration: none;
            color: inherit;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .doc-link:hover {
            transform: translateY(-5px);
        }

        .image-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doc-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .doc-link:hover .doc-img {
            transform: scale(1.08);
        }

        .doc-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A202C;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid transparent;
            display: inline-block;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .doc-link:hover .doc-title {
            color: #E53E3E;
            border-color: #E53E3E;
        }

        .footer-note {
            text-align: center;
            padding: 60px 0;
            font-size: 16px; 
            color: #718096;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .footer-note span {
            color: #1A202C;
        }

        @media (max-width: 900px) {
            .col-4-row, .col-3-row {
                grid-column: span 6; 
        }

        @media (max-width: 600px) {
            .col-4-row, .col-3-row {
                grid-column: span 12; 
            }
        }
    </style>
</head>
<body>

    <div class="header-se">
        <h1 class="header-title-top">Contoh Kelengkapan Dokumen</h1>
        <h2 class="header-title-bottom">Sensus Ekonomi 2026</h2>
    </div>

    <div class="main-content">

                    <div class="image-wrapper">

            <div class="doc-card col-4-row">

            </div>

            <div class="doc-card col-4-row">

            </div>

            <div class="doc-card col-3-row">

    </div>

</body>
</html>
